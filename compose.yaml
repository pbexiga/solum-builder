# `docker compose up` serves Solum Builder on http://<host>:${PORT:-8000}
# It runs as it is. To keep things elsewhere or use another port, copy `.env.example` to
# `.env` next to this file and edit it.
services:
  solum-builder:
    image: solum-builder:latest
    build:
      context: .
      target: runtime   # the Dockerfile's last stage is the dev image
    ports:
      - "${PORT:-8000}:8000"
    environment:
      CACHE_MAX_GB: ${CACHE_MAX_GB:-2}
      # the folders below as this machine names them, for File → Settings… to show (D-313)
      HOST_DATA_DIR: ${DATA_DIR:-./data}
      HOST_CACHE_DIR: ${CACHE_DIR:-./cache}
    volumes:
      # Host folders. DATA_DIR holds your circuits: back it up.
      # CACHE_DIR must be on a local disk (SQLite), and is safe to delete.
      - ${DATA_DIR:-./data}:/data
      - ${CACHE_DIR:-./cache}:/cache
    restart: unless-stopped
