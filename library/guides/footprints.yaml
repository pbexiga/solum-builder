# Stripboard footprints (D-367): how far apart a part's legs go on a 0.1" (2.54 mm) board
# and what its body covers. The one source for the stripboard layouts (`solum.stripboard`).
#
# Sizes in mm, as the source gives them; `holes` are the leg steps on the board (0.1"
# each) a part's legs are bent to. A capacitor's go from its own pitch to a hole or two
# wider, the leads bent out (the user, 2026-11-26, D-410): a longer reach bridges strips.
# Each span is the least the part's real size allows, as published boards lay it (D-410).
# A body covers every hole whose centre is inside it
# (a box: `length` along the legs' line, `width` across; round: `diameter`), centred on
# its legs. A part with no entry for its type, kind, value or package gets no layout, and
# the window says so; a surface-mount part (SMD, SC-59, SOT-23) never goes on a stripboard.

# Two legs lying flat (at least `flat` holes apart: the legs bend just past the body) or
# standing (at least `stand` holes apart, the body upright over one leg, covering no other
# hole). Longer leads are the builder's call: no most. A link may run under any body (D-410).
# An axial electrolytic lies flat or stands as a resistor does (D-411).
axial:
  resistor:  # by rating: the first whose `max_watts` holds the part's (¼ W when none set)
    - max_watts: 0.25
      length: 6.3
      diameter: 2.5
      flat: 3  # 7.62 mm (300 mil, 4 holes), the leads bent just past the body (D-410)
      stand: 1
      source: >
        KiCad R_Axial_DIN0207_L6.3mm_D2.5mm (P7.62mm Horizontal, P2.54mm Vertical),
        after Yageo's ¼ W metal-film sheet (cdn-reichelt.de B400 1_4W#YAG.pdf)
    - max_watts: 0.5
      length: 9.0
      diameter: 3.2
      flat: 5
      stand: 2
      source: >
        KiCad R_Axial_DIN0309_L9.0mm_D3.2mm (P12.70mm Horizontal, P5.08mm Vertical),
        after the same Yageo sheet
  diode:  # by the model's package (its name starts with `package`)
    - package: DO-35
      length: 4.0
      diameter: 2.0
      flat: 2  # 5.08 mm: legs bent at the body, as published boards lay it (D-410)
      stand: 1
      source: >
        KiCad D_DO-35_SOD27 (P7.62mm Horizontal, P2.54mm Vertical), after Diodes Inc.'s
        DO-35 outline (diodes.com/_files/packages/DO-35.pdf)
    - package: DO-34
      length: 3.04
      diameter: 1.6
      flat: 2  # 5.08 mm: legs bent at the body, as published boards lay it (D-410)
      stand: 1
      source: KiCad D_DO-34_SOD68 (P7.62mm Horizontal, P2.54mm Vertical), after NXP's KTY83 outline
    - package: DO-41
      length: 5.2
      diameter: 2.7
      flat: 2  # 5.08 mm: legs bent at the body, as published boards lay it (D-410)
      stand: 1
      source: >
        KiCad D_DO-41_SOD81 (P7.62mm Horizontal, P5.08mm Vertical), after Diodes Inc.'s
        DO-41 outline (diodes.com Package-Files/DO-41-Plastic.pdf)
    - package: DO-15
      length: 7.6
      diameter: 3.6
      flat: 4
      stand: 2
      source: >
        KiCad D_DO-15 (P10.16mm Horizontal, P5.08mm Vertical), after Diodes Inc.'s DO-15
        outline (diodes.com/_files/packages/DO-15.pdf)

    - package: DO-7
      length: 7.62
      diameter: 2.71
      flat: 4
      stand: 2
      source: >
        BKC Semiconductors 1N34A sheet, DO-7 glass package: body 5.85-7.62 mm long,
        2.16-2.71 mm across (the largest taken; highered.mheducation.com 1N34A.pdf); its
        spans as DO-15's, the same length

  electrolytic:  # axial (a capacitor's `axial`, D-411), by value at 25 V, the first whose `max_value` holds it
    - max_value: 47µ
      length: 10
      diameter: 4.5
      flat: 5
      stand: 2
      source: &asm >
        Vishay BCcomponents 021 ASM (axial standard miniature), document 28325, revision
        16-Sep-16, selection chart, 25 V column, nominal case D × L (vishay.com/docs/28325/
        021asm.pdf; smaller values at 25 V come in its smallest case, 4.5 × 10, at 63 V).
        Spans as the rows above follow: flat, the least holes holding the body and 1.3 mm
        of bent lead; standing, half the diameter and 1 mm of lead (D-411)
    - max_value: 100µ
      length: 10
      diameter: 6
      flat: 5
      stand: 2
      source: *asm
    - max_value: 150µ
      length: 11
      diameter: 8
      flat: 5
      stand: 2
      source: *asm
    - max_value: 220µ
      length: 18
      diameter: 6.5
      flat: 8
      stand: 2
      source: *asm
    - max_value: 330µ
      length: 18
      diameter: 8
      flat: 8
      stand: 2
      source: *asm
    - max_value: 470µ
      length: 18
      diameter: 10
      flat: 8
      stand: 3
      source: *asm
    - max_value: 680µ
      length: 25
      diameter: 10
      flat: 11
      stand: 3
      source: *asm
    - max_value: 1m
      length: 30
      diameter: 12.5
      flat: 13
      stand: 3
      source: *asm

# Two legs standing, `holes` apart (the maker's `pitch` bent to the nearest 0.1" step).
radial:
  electrolytic:  # by value at 25 V, the first whose `max_value` holds it
    - max_value: 47µ
      diameter: 5
      pitch: 2.0
      holes: [1, 2, 3]
      source: &nrws >
        NIC Components NRWS (miniature radial electrolytics), case size table, 25 V column,
        and lead spacing by case diameter (niccomp.com; read from
        wts-electronic.de/download/nic-nrws-elko.pdf)
    - max_value: 100µ
      diameter: 6.3
      pitch: 2.5
      holes: [1, 2, 3]
      source: *nrws
    - max_value: 330µ
      diameter: 8
      pitch: 3.5
      holes: [1, 2, 3]
      source: *nrws
    - max_value: 1m
      diameter: 10
      pitch: 5.0
      holes: [2, 3]
      source: *nrws
  film:  # box film, by value at 63 V
    - max_value: 150n
      length: 7.2
      width: 2.5
      pitch: 5
      holes: [2, 3, 4]
      source: &mks2 >
        WIMA MKS 2 (polyester, PCM 5 mm), general data table, 63 VDC column, W × H × L
        (page 2; wima.de/wp-content/uploads/media/e_WIMA_MKS_2.pdf, read 2026-11-24: W
        across the legs; 2.2 µF and up corrected to that column, D-398)
    - max_value: 220n
      length: 7.2
      width: 3
      pitch: 5
      holes: [2, 3, 4]
      source: *mks2
    - max_value: 470n
      length: 7.2
      width: 3.5
      pitch: 5
      holes: [2, 3, 4]
      source: *mks2
    - max_value: 680n
      length: 7.2
      width: 4.5
      pitch: 5
      holes: [2, 3, 4]
      source: *mks2
    - max_value: 1µ
      length: 7.2
      width: 5
      pitch: 5
      holes: [2, 3, 4]
      source: *mks2
    - max_value: 1.5µ
      length: 7.2
      width: 5.5
      pitch: 5
      holes: [2, 3, 4]
      source: *mks2
    - max_value: 2.2µ
      length: 7.2
      width: 7.2
      pitch: 5
      holes: [2, 3, 4]
      source: *mks2
    - max_value: 3.3µ
      length: 7.2
      width: 11
      pitch: 5
      holes: [2, 3, 4]
      source: *mks2
    - max_value: 4.7µ
      length: 7.2
      width: 11
      pitch: 5
      holes: [2, 3, 4]
      source: *mks2
  c0g:  # leaded MLCC, the smallest case; larger values take a larger case (not listed)
    - max_value: 1µ
      length: 4.0
      width: 2.5
      pitch: 2.5
      holes: [1, 2, 3, 4]
      source: &fg >
        TDK FG series leaded MLCCs, FG18 (2.5 mm lead spacing) and FG28 (5 mm), 4.0 × 5.5 ×
        2.5 mm (TDK Electronics, "Halogen-free leaded MLCCs for automotive and general
        purpose applications", tdk-electronics.tdk.com tech library)
  ceramic:
    - max_value: 1µ
      length: 4.0
      width: 2.5
      pitch: 2.5
      holes: [1, 2, 3, 4]
      source: *fg
  led:  # an LED on the board (the status LED is off it), by the model's package
    - package: T-1 3/4
      diameter: 5.8
      pitch: 2.54
      holes: [1]
      source: >
        KiCad LED_D5.0mm (5.8 mm flange), after a 5 mm LED sheet
        (cdn-reichelt.de A500 LL-504BC2E-009.pdf)
    - package: T-1
      diameter: 3.8
      pitch: 2.54
      holes: [1]
      source: KiCad LED_D3.0mm (3.8 mm flange)

# Three legs in a line, in their package's pin order, each `holes` from the next (both
# steps the same; 2 is the legs bent out). By the model's package, the longest match.
inline:
  - package: TO-92
    length: 4.6
    width: 4.2
    holes: [1, 2]
    source: >
      KiCad TO-92_Inline_Wide (legs 2.54 mm apart, body outline), after NXP SOT54
      (sot054_po.pdf); the narrow 1.27 mm legs are bent out to the board's 2.54 mm, as on
      stripboard. TO-92 mini takes the same: its body is smaller
  - package: TO-18
    diameter: 4.8
    holes: [1, 2]
    source: KiCad TO-18-3 (can outline); the legs, on a circle, bent into a line
  - package: TO-5
    diameter: 8.5
    holes: [1, 2]
    source: KiCad TO-5-3 (can outline); the legs, on a circle, bent into a line
  - package: TO-1
    holes: [1, 2]
    source: &flying >
      Flying wire leads, e b c in a line (the model's own outline, its package record):
      the body stands clear above the board on its leads, so it covers no hole
  - package: SO-2
    holes: [1, 2]
    source: *flying
  - package: X02
    holes: [1, 2]
    source: *flying

trimmer:  # a board trimmer in line (a trimmer's `style: inline`): three legs in a line, 1, wiper, 3
  length: 9.53
  width: 4.83
  holes: [1]
  source: >
    Bourns 3296W (multiturn, top adjust, pins in line 2.54 mm apart), body 9.53 × 4.83 mm:
    KiCad Potentiometer_Bourns_3296W_Vertical, after bourns.com/pdfs/3296.pdf

# The default board trimmer (D-393): legs 1 and 3 two holes apart, the wiper one hole
# back between them, toward you as you look down on it with 1 on the left. `length` runs
# along 1 to 3, `width` across.
trimmer_triangle:
  length: 6.60
  width: 6.99
  holes: [1]
  source: >
    Bourns 3362P (1/4" square, single turn, top adjust), "3362 – 1/4˝ Square Trimpot®
    Trimming Potentiometer" (bourns.com/docs/Product-Datasheets/3362.pdf, read
    2026-11-23), page 1: body 6.60 (.260) × 6.99 (.275) mm; 3362P pins 2.54 (.100) apart
    along the row, pin 2 2.54 (.100) back from pins 1 and 3, on the 0.1" grid

# A chip in a DIP across the strips: its pins down two columns `row_holes` apart, one
# strip per pin pair, pin 1 at the top left or (turned round) the bottom right.
dip:
  row_holes: 3
  width: 6.35
  source: KiCad DIP-8_W7.62mm, DIP-14_W7.62mm, DIP-16_W7.62mm (7.62 mm rows, body outline)

# A DIP switch (D-238) on the board as a chip's DIP (D-397): switch k from pin k to the
# pin across from it, 1 at the top left; its body runs a pitch per switch plus `extra`.
dip_switch:
  row_holes: 3
  width: 6.20
  extra: 1.00
  source: >
    Same Sky DS04-254 (through hole, 2.54 mm pitch, 1 to 12 positions), "DS04-254 DIP
    switch" (sameskydevices.com/product/resource/ds04-254.pdf, rev 1.03 of 12/18/2024,
    read 2026-11-23), page 2: P = 2.54, rows 7.62 apart, body 6.20 wide and
    L = P × N + 1.00 long (6.08 for 2 positions); the schematic joins 1 to 2 per switch

# A chip in a single row of pins (the M5218AL's SIL-8), one strip per pin.
sil:
  width: 3.0
  source: KiCad SIP-8_19x3mm_P2.54mm, after NJR's SIP8 outline (njr.com SIP8_E.pdf)
