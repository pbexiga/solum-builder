id: battery-beside-adapter
layer: topology
severity: warning
check: battery_beside_adapter
title: Battery not switched by the DC jack
message: "{ref}'s + is on {net}, not on {jack}'s battery lug, so a DC plug in {jack} doesn't cut the battery off."
why: >
  A pedal's DC jack switches the battery out: the battery's + goes to the jack's battery
  lug, which touches the sleeve (V+) only with no plug in. Wired straight to V+, the
  battery stays connected beside the adapter, so the adapter pushes current into the
  battery (or the battery into the adapter) whenever both are in. The simulation runs it
  as wired, through the battery's internal resistance.
fix: "Wire {ref}'s + to {jack}'s battery lug (bat) instead of to {net}."
fixtures:
  bad:
    - rails: {V+: 9}
      parts:
        - {ref: DC, type: dcjack, pins: {"+": V+, "-": GND}}
        - {ref: BAT1, type: battery, resistance: "2", pins: {"+": V+, "-": GND}}
        - {ref: R1, type: resistor, nets: [V+, GND], value: 10k}
      expect: [BAT1]
  good:
    - rails: {V+: 9}   # through the battery lug, as the 9 V power block wires it
      parts:
        - {ref: DC, type: dcjack, pins: {"+": V+, "-": GND, sw: bpos}}
        - {ref: BAT1, type: battery, pins: {"+": bpos, "-": GND}}
        - {ref: R1, type: resistor, nets: [V+, GND], value: 10k}
    - parts:   # no DC jack: the battery is the only supply
        - {ref: BAT1, type: battery, pins: {"+": V+, "-": GND}}
        - {ref: R1, type: resistor, nets: [V+, GND], value: 10k}
