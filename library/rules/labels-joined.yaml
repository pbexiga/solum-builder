id: labels-joined
layer: topology
severity: error
check: labels_joined
stops_sim: true
title: Labels wired together
message: "{what}"
why: >
  A net has one name. Two labels wired together join nets you meant to keep apart (a
  supply and ground is a dead short), or one of them is a leftover.
fix: Remove the wire, or one of the labels if they're meant to be one net.
fixtures:
  bad:
    - parts:
        - {ref: R1, type: resistor, nets: [a, GND], value: 10k}
      labels:
        - {net: b, pos: [80, 100]}   # on R1 pin 1, which is already labelled a
  good:
    - starter: ts808
