    - parts:
        - {ref: R1, type: resistor, nets: [a, GND], value: 10k}
        - {ref: OUT, type: amp, nets: [a]}
  good:
    - starter: ts808
    - template: true
      parts:
        - {ref: R1, type: resistor, nets: [a, GND], value: 10k}
