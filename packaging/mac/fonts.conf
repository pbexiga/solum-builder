<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- The Mac app's fontconfig file (D-324). The PDFs' own font (Lora) comes by @font-face;
     this lets fontconfig find macOS's fonts for anything Lora lacks, without the paths the
     libraries were built with. -->
<fontconfig>
  <dir>/System/Library/Fonts</dir>
  <dir>/Library/Fonts</dir>
  <cachedir>~/Library/Caches/Solum Builder/fontconfig</cachedir>
</fontconfig>
