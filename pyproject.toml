[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "solum-builder"
dynamic = ["version"]
description = "Self-hosted circuit simulator for guitar-pedal builders"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "numpy>=2.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "weasyprint>=62",
    "markdown-it-py>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-xdist>=3.6",
    "hypothesis>=6",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "playwright>=1.47",
]

# The Mac app (D-321): its window, and the bundler `make mac-app` uses.
mac = [
    "pywebview>=6.2",
    "pyinstaller>=6.22",
]

[project.scripts]
solum = "solum.cli:main"

[tool.setuptools.packages.find]
include = ["solum*"]

[tool.ruff]
line-length = 100
target-version = "py312"
# worked/: each part's fit as it was done, cited by its model record; kept as written.
extend-exclude = ["scratch", ".claude/skills/fit-model/worked"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Typography the records and messages use on purpose: minus sign, en dash (ranges), times.
allowed-confusables = ["−", "–", "×"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
python_version = "3.12"
packages = ["solum"]

[[tool.mypy.overrides]]
module = ["weasyprint", "weasyprint.*"]
ignore_missing_imports = true

# The Mac app's window (D-321): pywebview and pyobjc are installed for `make mac-app` only.
[[tool.mypy.overrides]]
module = ["webview", "webview.*", "AppKit", "Foundation", "PyObjCTools"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "sim: runs real ngspice (tests/sim)",
    "acceptance: classic circuits vs .expected.yaml (tests/acceptance)",
    "parity: JS linear solver vs ngspice .ac (tests/parity)",
    "rules: per-rule fixtures, corpus, mutations (tests/rules)",
    "ui: Playwright smoke tests (tests/ui)",
    "timing: checks how fast something is; run on its own, after the rest (make accept)",
]

[tool.coverage.run]
source = ["solum"]
# desktop/window.py: the Mac app's window, which needs macOS and a screen (D-321)
omit = ["solum/api/*", "solum/desktop/window.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.setuptools.dynamic]
# The one version number: solum/__init__.py (the API, About and the exports read it).
version = {attr = "solum.__version__"}
