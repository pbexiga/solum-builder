# A published stripboard layout entered by hand (P8 R2, D-410): our check must pass it with
# no faults, its warnings as listed below (tests/unit/test_stripboard_samples.py).
# Read hole by hole from the drawing by the agent, 2026-11-26.
starter: klon-centaur
drawing:
  title: Tagboard Effects, "Klon Centaur - Smaller" (IvIark)
  url: https://tagboardeffects.blogspot.com/2012/02/klon-centaur.html
  size: [21, 26]
  cuts: 32
  links: 14
# The drawing's own parts where they differ from our starter's, applied to the circuit
# before the check: `kind` a capacitor's kind.
circuit:
  kind: {C11: ceramic, C10: electrolytic}
differences:
  - >-
    Its ICL7660 is our MAX1044 (pin-compatible; pin 1 to the 9 V on both).
  - >-
    It wires the footswitch on the board (Sw1, Sw4, Sw5, Sw6); ours has no footswitch. The
    560R from the buffer (our R4) goes through switch lug 4 to a 68K (B21-B25, our R243):
    here R4 is off the board, wired from C6 and to A25, as if at the switch. Its second 68K
    (from Volume 2 and Sw6 to the output) is left off and Volume 2 goes to C21; the Sw1
    wire on the clipping node is left off.
  - >-
    It has a 1M from the input to ground (E11-E13) and an LED with a 4K7 (S22-S25, LED+);
    ours has neither, so they're left off.
  - >-
    Its tone network has the 4K7 on Tone lug 3 and the 1K8 on Tone lug 1; ours has R21
    (1k8) on lug 3 and R23 (4k7) on lug 1: each sits in the other's holes.
  - >-
    Its 2n2 is a ceramic and the 1u at Q10-Q11 an electrolytic, as drawn (ours: box film).
  - >-
    It lays the 15K at P6-P8 and the 392K at F15-F17 flat with legs 2 apart, which only a
    1/8 W resistor fits: they stand here. Its germanium diodes (S10-S13, T10-T13) lie flat
    3 apart; our DO-7 lies flat from 4 (glass, not bent at the body), so they stand too.
  - >-
    The input's sleeve goes to F13 here, the output's to it.
  - >-
    It joins strips 9, 15 and 19 with two links ending in one hole (P15, "watch double link
    in single hole"): a tap (D-410). Links start and end under all three chips.
warnings:
  - "R29 and C17's bodies touch: move one a hole further away if you can."
  - "C16 and R15's bodies touch: move one a hole further away if you can."
  - "D2 and D3's bodies touch: move one a hole further away if you can."
  - "R243 and D4's bodies touch: move one a hole further away if you can."
