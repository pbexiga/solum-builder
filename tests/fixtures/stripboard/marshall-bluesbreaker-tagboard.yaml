# A published stripboard layout entered by hand (P8 R2, D-410): our check must pass it with
# no faults, its warnings as listed below (tests/unit/test_stripboard_samples.py).
# Read hole by hole from the drawing by the agent, 2026-11-26.
starter: marshall-bluesbreaker
drawing:
  title: Tagboard Effects, "Marshall Bluesbreaker" (IvIark)
  url: https://tagboardeffects.blogspot.com/2012/02/marshall-bluesbreaker.html
  size: [21, 10]
  cuts: 19
  links: 3
# The drawing's own parts where they differ from our starter's, applied to the circuit
# before the check: `omit` parts it leaves out, `kind` a capacitor's kind.
circuit:
  omit: [C5]
  kind: {C3: ceramic, C6: ceramic}
differences:
  - >-
    Its second stage's gain leg (from Gain lug 3) is two sections, 220n-4K7-220n-4K7; ours
    is C6 (100n) and R8 (10k). The first 220n (J6-J8) and 4K7 (K6-K9) are left off; C6 sits
    in the second 220n's holes (L8-L9, a ceramic, as drawn) and R8 in the second 4K7's
    (M4-M8); Gain lug 3 goes to K9 instead of A8.
  - >-
    Its 10n from the first stage's filter (E7-E9) goes to the 4.5 V rail; ours (C3) goes to
    ground, so it stands one strip down (E9-E10), a ceramic to fit.
  - >-
    It has no 47u on the chip's supply (our C5): left out of the circuit.
  - >-
    Values differ (its 2M2 and 1M pulldowns, ours 1M5; its 4K7 where ours has R8's 10k):
    the check is by connection only.
  - >-
    Its D5 (1N4001) is our D1; its D1-D4 are our D3, D5, D2 and D4 (each by its band). Two
    diodes in series share each of their one-hole strips (N5, P5).
  - >-
    The input's sleeve goes to D10 here, the output's to it.
warnings:
  - "D3 and D5 share N5: check both leads fit."
  - "D2 and D4 share P5: check both leads fit."
  - "C10 and D1's bodies touch: move one a hole further away if you can."
