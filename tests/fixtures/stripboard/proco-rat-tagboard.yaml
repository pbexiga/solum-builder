# A published stripboard layout entered by hand (P8 R2, D-410): our check must pass it with
# no faults, its warnings as listed below (tests/unit/test_stripboard_samples.py).
# Read hole by hole from the drawing by the agent, 2026-11-26.
starter: proco-rat
drawing:
  title: Tagboard Effects, "Proco Rat - smaller" (IvIark)
  url: https://tagboardeffects.blogspot.com/2012/01/proco-rat.html
  size: [20, 11]
  cuts: 15
  links: 4
# The drawing's own parts where they differ from our starter's, applied to the circuit
# before the check: `omit` parts it leaves out.
circuit:
  omit: [C12]
# How it differs from our starter, and what was changed to draw it on our circuit:
differences:
  - >-
    It has no 100n beside the 100u on the supply (our C12): left out of the circuit.
  - >-
    It puts the 1K before the 4u7 after the op-amp; ours has C7 (4u7) first, then R6 (1K).
    The two swap places: C7 lies across L5-L8 (the 1K's holes) and R6 stands at K8-K9.
  - >-
    Its 100u is drawn about 5 mm across; ours is the 6.3 mm can of a 25 V part, which at S
    covers C8's leg (R8) and the 9 V wire (T7). C11 moves a column right (T4-T11), the 9 V
    wire to Q7 and Filter lug 1 to S9.
  - >-
    Distortion lugs 2-3 and Filter lugs 2-3 are joined at the pot; ours leaves lug 3
    unwired. The input and the 9 V share the drawing's ground hole: the input's sleeve here
    goes to B11, the output's sleeve to it, Volume lug 1 to the output's sleeve.
  - >-
    Its D1 and D2 are our D2 and D1 (each by its band); its capacitors reach on long bent
    leads (the 4u7 at E 5 apart, the 1n film at F 6 apart), which our check allows (D-410).
warnings:
  - "R4 and C5's bodies touch: move one a hole further away if you can."
  - "C2 and C13's bodies touch: move one a hole further away if you can."
  - "R11 and C7's bodies touch: move one a hole further away if you can."
  - "C7 and R10's bodies touch: move one a hole further away if you can."
  - "C10 and Q1's bodies touch: move one a hole further away if you can."
  - "C11 hangs past the board's edge: check it clears the enclosure, or move it in."
