# A hand-made stripboard layout of the Dallas Rangemaster starter (D-367): P6a's check
# must pass it, and refuse each broken copy in tests/unit/test_stripboard.py. Off-board wires
# (D-375): each lug to its pad, the output jack's sleeve to the input's.
#   strip 1 V-, 2 GND, 3 Q1's emitter, 4 its base, 5 its collector, 6 the input,
#   7 C2 to VR1's wiper, 8 V- (left of the cut at G8) and GND (right), 9 the output.
size: [12, 9]
parts:
  Q1: {E: E3, B: E4, C: E5}
  R1: {1: C8, 2: C4}
  R2: {1: I4, 2: I8}  # by Q1's base: within 4 holes of E4 (the high-gain input, D-400)
  R3: {1: H3, 2: H2}
  C1: {1: F6, 2: F4}
  C2: {1: F7, 2: F9}
  C3: {1: F2, 2: F3}  # F and J, R3 standing at H between: a can beside a standing body touches (D-403)
  C4: {1: J2, 2: J1}
standing: [R3]
cuts: [G8]
links: [[B1, B8], [K2, K8]]
wires:
  - {from: V-, hole: A1}
  - {from: VR1.1, hole: D1}
  - {from: GND, hole: A2}
  - {from: IN.S, hole: D2}
  - {from: OUT.S, lug: IN.S}
  - {from: VR1.3, hole: A5}
  - {from: IN.out, hole: A6}
  - {from: VR1.2, hole: A7}
  - {from: OUT.in, hole: A9}
