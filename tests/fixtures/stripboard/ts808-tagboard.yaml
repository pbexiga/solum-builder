# A published stripboard layout entered by hand (P8 R2, D-410): our check must pass it with
# no faults, its warnings as listed below (tests/unit/test_stripboard_samples.py).
# Read hole by hole from the drawing by the agent, 2026-11-26.
starter: ts808
drawing:
  title: Tagboard Effects, "Ibanez TS808 layout 2" (IvIark)
  url: https://tagboardeffects.blogspot.com/2012/02/ibanez-ts808.html
  size: [20, 15]
  cuts: 17
  links: 7
# The drawing's own parts where they differ from our starter's, applied to the circuit
# before the check: `model` a part's model, `half` which half of the dual op-amp a stage is
# (the stage then takes that half's ref: our IC1A, on half B, is IC1B).
circuit:
  model: {Q1: 2N5088, Q3: 2N5088}
  half: {IC1A: b, IC1B: a}
differences:
  - >-
    It names a 2N5088 (E-B-C) for both transistors, drawn C-B-E down a column; our 2SC1815
    is E-C-B, so the test uses the 2N5088 the drawing names.
  - >-
    The drive stage is the chip's pins 1-3 and the tone stage pins 5-7; ours has them the
    other way round (IC1B drives), so the test swaps the halves.
  - >-
    Its 4K7 and 47n from the drive stage's inverting input go 4K7 first, then 47n to the
    4.5 V rail; ours has C3 (47n) first, then R4 (4k7) to ground. C3 lies across H5-H11 (the
    4K7's holes) and R4 stands from G11 to the ground strip (G12).
  - >-
    Its Level lug 1 goes to the 4.5 V rail (T9, through the T9-T10 link); ours goes to
    ground (D12 here).
  - >-
    It has a 1M from the input to ground and an LED with a 4K7 (the LED+ wire); ours has
    neither, so they're left off.
  - >-
    The input's and the output's sleeves share its ground hole: the input's goes to T12
    here, the output's to it.
  - >-
    The drawing shows the TS808's two links ending in one hole (M4, "note double link in
    single hole"): a tap, under the chip between its rows (D-410). Its 100n lies along strip
    14 over a cut (Q14).
