- circuit: boss-ds1
  mutation: remove-part C15
  reason: "VB's filter cap: without it VB is a bare divider, which still biases every stage (the bias-net rule only follows nets a big cap holds, D-225); in a real build VB carries more supply noise."
- circuit: boss-ds1
  mutation: remove-part C4
  reason: "Booster's feedback cap (with R7): without it the stage keeps more highs, a change of the frequency response rather than a fault."
- circuit: boss-ds1
  mutation: remove-part C7
  reason: "Gain stage's feedback cap: without it the stage keeps more highs at high Distortion, a change of the frequency response rather than a fault."
- circuit: boss-ds1
  mutation: remove-part D1
  reason: "Reverse-polarity protection across the supply: it conducts only when the supply is connected the wrong way round, which the simulation never does; leaving it out changes nothing in normal use."
- circuit: boss-ds1
  mutation: remove-part D4
  reason: "Clipping diode: without it (or turned round, so the pair clips one side only) the stage clips less or asymmetrically, a change of sound rather than a fault."
- circuit: boss-ds1
  mutation: remove-part D5
