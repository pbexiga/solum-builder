- circuit: boss-ds1
  mutation: remove-part D8
  reason: "Input protection for IC1A: it conducts only if Q2 drives the + input below ground, which the simulated op-amp survives; leaving it out changes nothing in normal playing."
- circuit: boss-ds1
  mutation: remove-part R16
  reason: "Tone stack's low-pass resistor: without it Tone's bass side gets no signal, so the knob turns from silence to treble; a change of sound, and every node keeps a DC path."
- circuit: boss-ds1
  mutation: remove-part R17
  reason: "Tone stack's high-pass leg to VB: without it the treble side still reaches VB through the pot and R16, so the stack works with another response; no rule can know the response you intended."
- circuit: boss-ds1
  mutation: remove-part R19
  reason: "From R18 to VB ahead of C13: against R18 it divides the signal by almost nothing (10k into 1M), and without it C13's input side still finds DC through Level; Q3 stays biased by R20."
- circuit: boss-ds1
  mutation: remove-part R23
  reason: "Output pull-down: without it the output cap's free side floats when nothing is plugged in, which can pop, but the amp's input (1M) holds it in the simulation."
- circuit: boss-ds1
  mutation: remove-part R5
  reason: "Q2's base resistor to ground: without it the stage is still biased, by R7 alone (collector feedback), at a lower collector voltage; a change of bias, not a fault any rule can name."
- circuit: boss-ds1
  mutation: reverse D4
  reason: "Clipping diode: without it (or turned round, so the pair clips one side only) the stage clips less or asymmetrically, a change of sound rather than a fault."
- circuit: boss-ds1
  mutation: reverse D5
  reason: "Clipping diode: without it (or turned round, so the pair clips one side only) the stage clips less or asymmetrically, a change of sound rather than a fault."
